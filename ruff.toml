# Ruff configuration - Netgear LM1200 SMS Gateway
#
# Why this file exists:
# Without it, `ruff check` follows whatever default rule set the installed Ruff
# version happens to ship. That default is not a stable contract: Ruff 0.16
# enables 415 rules where earlier versions enabled four groups, which turned a
# green CI red on an unchanged tree. Pinning the rule set here makes the lint
# gate reproducible and independent of the Ruff release that CI happens to pull.
#
# The selection below is the contract every release up to v1.3.0 was verified
# against. Widening it is a deliberate decision, not a side effect of an upgrade.

target-version = "py310"
line-length = 120

[lint]
# pycodestyle errors (E4 imports, E7 statements, E9 runtime) + pyflakes (F).
select = ["E4", "E7", "E9", "F"]
